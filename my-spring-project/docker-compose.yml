version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  python-llm-api:
    build:
      context: ./llm-node/python-llm-api
    ports:
      - "5000:5000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - QDRANT_HOST=cf19a9b2-fef9-49a9-96b2-003c18348045.eu-central-1-0.aws.cloud.qdrant.io
      - QDRANT_GRPC_PORT=6334
      - QDRANT_TLS=true
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    depends_on:
      - qdrant

  recipe-node-1:
    build:
      context: .
      dockerfile: recipe-node/Dockerfile
    ports:
      - "8100:8100"
    environment:
      - SERVER_PORT=8100
      - QDRANT_HOST=cf19a9b2-fef9-49a9-96b2-003c18348045.eu-central-1-0.aws.cloud.qdrant.io
      - QDRANT_GRPC_PORT=6334
      - QDRANT_TLS=true
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    depends_on:
      - qdrant

  recipe-node-2:
    build:
      context: .
      dockerfile: recipe-node/Dockerfile
    ports:
      - "8101:8101"
    environment:
      - SERVER_PORT=8101
      - QDRANT_HOST=cf19a9b2-fef9-49a9-96b2-003c18348045.eu-central-1-0.aws.cloud.qdrant.io
      - QDRANT_GRPC_PORT=6334
      - QDRANT_TLS=true
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    depends_on:
      - qdrant

  recipe-node-3:
    build:
      context: .
      dockerfile: recipe-node/Dockerfile
    ports:
      - "8102:8102"
    environment:
      - SERVER_PORT=8102
      - QDRANT_HOST=cf19a9b2-fef9-49a9-96b2-003c18348045.eu-central-1-0.aws.cloud.qdrant.io
      - QDRANT_GRPC_PORT=6334
      - QDRANT_TLS=true
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    depends_on:
      - qdrant

  llm-node-1:
    build:
      context: .
      dockerfile: llm-node/Dockerfile
    ports:
      - "8120:8120"
    environment:
      - SERVER_PORT=8120
      - PYTHON_LLM_API_BASE_URL=http://python-llm-api:5000
    depends_on:
      - python-llm-api

  llm-node-2:
    build:
      context: .
      dockerfile: llm-node/Dockerfile
    ports:
      - "8121:8121"
    environment:
      - SERVER_PORT=8121
      - PYTHON_LLM_API_BASE_URL=http://python-llm-api:5000
    depends_on:
      - python-llm-api

  python-etl-api:
    build:
      context: ./ETL-node/etl-api
    ports:
      - "6000:6000"
    environment:
      - QDRANT_HOST=cf19a9b2-fef9-49a9-96b2-003c18348045.eu-central-1-0.aws.cloud.qdrant.io
      - QDRANT_GRPC_PORT=6334
      - QDRANT_API_KEY=${QDRANT_API_KEY}

  etl-node-1:
    build:
      context: .
      dockerfile: ETL-node/Dockerfile
    ports:
      - "8140:8140"
    environment:
      - SERVER_PORT=8140
      - PYTHON_ETL_API_BASE_URL=http://python-etl-api:6000
    depends_on:
      - python-etl-api

  etl-node-2:
    build:
      context: .
      dockerfile: ETL-node/Dockerfile
    ports:
      - "8141:8141"
    environment:
      - SERVER_PORT=8141
      - PYTHON_ETL_API_BASE_URL=http://python-etl-api:6000
    depends_on:
      - python-etl-api

  coordinator-1:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - NODE_ID=coordinator-1:8080
    depends_on:
      - recipe-node-1
      - recipe-node-2
      - recipe-node-3
      - llm-node-1
      - llm-node-2
      - etl-node-1
      - etl-node-2

  coordinator-2:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - NODE_ID=coordinator-2:8081
    depends_on:
      - recipe-node-1
      - recipe-node-2
      - recipe-node-3
      - llm-node-1
      - llm-node-2
      - etl-node-1
      - etl-node-2

  coordinator-3:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - NODE_ID=coordinator-3:8082
    depends_on:
      - recipe-node-1
      - recipe-node-2
      - recipe-node-3
      - llm-node-1
      - llm-node-2
      - etl-node-2

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - coordinator-1

  cluster-init:
    image: alpine/curl
    depends_on:
      - coordinator-1
      - coordinator-2
      - coordinator-3
      - recipe-node-1
      - recipe-node-2
      - recipe-node-3
      - llm-node-1
      - llm-node-2
      - etl-node-1
      - etl-node-2
    command: >
      sh -c "
        echo 'Waiting for cluster to start (40s)...' &&
        sleep 40 &&
        echo 'Registering coordinators...' &&
        curl -s -X POST 'http://coordinator-2:8081/follow?id=coordinator-1:8080' &&
        curl -s -X POST 'http://coordinator-3:8082/follow?id=coordinator-1:8080' &&
        echo 'Registering Recipe DB nodes...' &&
        curl -s -X POST 'http://coordinator-1:8080/apply?id=recipe-node-1:8100&type=db' &&
        curl -s -X POST 'http://coordinator-1:8080/apply?id=recipe-node-2:8101&type=db' &&
        curl -s -X POST 'http://coordinator-1:8080/apply?id=recipe-node-3:8102&type=db' &&
        echo 'Registering LLM nodes...' &&
        curl -s -X POST 'http://coordinator-1:8080/apply?id=llm-node-1:8120&type=llm' &&
        curl -s -X POST 'http://coordinator-1:8080/apply?id=llm-node-2:8121&type=llm' &&
        echo 'Registering ETL nodes...' &&
        curl -s -X POST 'http://coordinator-1:8080/apply?id=etl-node-1:8140&type=etl' &&
        curl -s -X POST 'http://coordinator-1:8080/apply?id=etl-node-2:8141&type=etl' &&
        echo 'Cluster successfully wired up!'
      "

volumes:
  qdrant_data:
