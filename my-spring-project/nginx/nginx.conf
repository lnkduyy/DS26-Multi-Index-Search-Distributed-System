upstream coordinators {
    server coordinator-1:8080;
    server coordinator-2:8081;
    server coordinator-3:8082;
}

server {
    listen 80;
    server_name epicure.localhost;

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://coordinators/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /search {
        proxy_pass http://coordinators/search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /get {
        proxy_pass http://coordinators/get;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
